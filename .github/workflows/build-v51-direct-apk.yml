name: Build Dadban v5.1 Direct APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'direct-v51/**'
      - '.github/workflows/build-v51-direct-apk.yml'
      - 'v51-direct-trigger.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild MainActivity from direct text chunks
        shell: bash
        run: |
          mkdir -p direct-v51/android-app/app/src/main/java/ir/dadban/legalai
          cat direct-v51/MainActivity.parts/part*.ktfrag > direct-v51/android-app/app/src/main/java/ir/dadban/legalai/MainActivity.kt
          test -s direct-v51/android-app/app/src/main/java/ir/dadban/legalai/MainActivity.kt

      - name: Apply build compatibility fixes
        shell: bash
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' direct-v51/android-app/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' direct-v51/android-app/app/build.gradle.kts
          sed -i '/import androidx.compose.foundation.layout.weight/d' direct-v51/android-app/app/src/main/java/ir/dadban/legalai/MainActivity.kt
          grep -E 'compileSdk|targetSdk|versionName|versionCode' direct-v51/android-app/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: direct-v51/android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f direct-v51/android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t direct-v51/android-app/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh direct-v51/android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dadban-v5.1-no-otp-real-apk
          path: direct-v51/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
