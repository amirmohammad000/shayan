name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'payload/**'
      - '.github/workflows/build-android-apk.yml'
      - 'android-app/**'
  pull_request:
    paths:
      - 'payload/**'
      - '.github/workflows/build-android-apk.yml'
      - 'android-app/**'
      - 'ci-trigger.txt'

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat payload/part*.b64 | base64 --decode > /tmp/android_payload.tar.gz
          tar -xzf /tmp/android_payload.tar.gz
          test -f android-app/app/src/main/java/ir/dadban/legalai/MainActivity.kt
          test -f android-app/app/build.gradle.kts

      - name: Apply direct-menu mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android-app/app/src/main/java/ir/dadban/legalai')
          vm = root / 'MainViewModel.kt'
          s = vm.read_text()
          old = '''    init {\n        if (tokenStore.load() != null) refreshAccount() else state = state.copy(screen = AppScreen.AUTH)\n    }\n'''
          new = '''    init {\n        tokenStore.clear()\n        state = state.copy(\n            screen = AppScreen.HOME,\n            profile = UserProfile(fullName = "", completed = true),\n            entitlements = Entitlements(freeBasicRemaining = 3),\n            message = null\n        )\n    }\n'''
          if old not in s:
              raise SystemExit('Expected startup auth block not found')
          s = s.replace(old, new)
          s = s.replace('        state = UiState(screen = AppScreen.AUTH)\n', '        state = UiState(screen = AppScreen.HOME, profile = UserProfile(completed = true), entitlements = Entitlements(freeBasicRemaining = 3))\n')
          s = s.replace('                    state = UiState(screen = AppScreen.AUTH, message = "نشست شما منقضی شده است؛ دوباره وارد شوید.")\n', '                    state = UiState(screen = AppScreen.HOME, profile = UserProfile(completed = true), entitlements = Entitlements(freeBasicRemaining = 3), message = "این نسخه بدون ورود اجرا می‌شود.")\n')
          vm.write_text(s)

          models = root / 'Models.kt'
          s = models.read_text().replace('val screen: AppScreen = AppScreen.AUTH,', 'val screen: AppScreen = AppScreen.HOME,')
          models.write_text(s)

          main = root / 'MainActivity.kt'
          s = main.read_text()
          s = s.replace('            item { TextButton(onClick = vm::logout, modifier = Modifier.fillMaxWidth()) { Text("خروج از حساب") } }\n', '')
          main.write_text(s)
          PY
          grep -n "screen = AppScreen.HOME" android-app/app/src/main/java/ir/dadban/legalai/MainViewModel.kt | head

      - name: Apply build compatibility fixes
        shell: bash
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' android-app/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' android-app/app/build.gradle.kts
          sed -i '/import androidx.compose.foundation.layout.weight/d' android-app/app/src/main/java/ir/dadban/legalai/MainActivity.kt
          grep -E 'compileSdk|targetSdk' android-app/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dadban-v52-direct-menu-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
