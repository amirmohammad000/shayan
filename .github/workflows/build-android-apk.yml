name: Fetch Python Portable Runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'ci-trigger.txt'

jobs:
  fetch-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download and validate official Python embeddable runtime
        shell: powershell
        run: |
          $url = 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile python-3.12.10-embed-amd64.zip -UseBasicParsing
          Expand-Archive python-3.12.10-embed-amd64.zip -DestinationPath runtime-check -Force
          runtime-check\python.exe -c "import sqlite3, ssl, urllib.request, http.server, zipfile; print('runtime-ok', sqlite3.sqlite_version)"
          if (!(Test-Path runtime-check\python312._pth)) { throw 'python312._pth missing' }
          Get-FileHash python-3.12.10-embed-amd64.zip -Algorithm SHA256
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: python-3.12.10-embed-amd64
          path: python-3.12.10-embed-amd64.zip
          retention-days: 2
          if-no-files-found: error
